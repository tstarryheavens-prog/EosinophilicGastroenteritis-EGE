<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-opacity="0.4" />

  <!-- Medical Cross (Clean, Modern, Rounded) with drop shadow -->
  <g filter="url(#shadow)">
    <rect x="216" y="86" width="80" height="340" rx="24" fill="url(#crossGrad)" />
    <rect x="86" y="216" width="340" height="80" rx="24" fill="url(#crossGrad)" />
  </g>

  <!-- ECG Vital Line & Gut Curve Accent traversing across the cross -->
  <!-- Bold dynamic wave: flat -> small dip -> QRS sharp spike -> rebound -> smooth exit -->
  <path d="M 60 256 L 155 256 L 180 220 L 208 300 L 256 128 L 304 384 L 332 225 L 358 275 L 385 256 L 452 256" 
        fill="none" 
        stroke="#0f766e" 
        stroke-width="46" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <path d="M 60 256 L 155 256 L 180 220 L 208 300 L 256 128 L 304 384 L 332 225 L 358 275 L 385 256 L 452 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Core Highlights / Nodes -->
  <circle cx="256" cy="128" r="16" fill="#ffffff" filter="url(#glow)" />
  <circle cx="304" cy="384" r="13" fill="#5eead4" />
  <circle cx="60" cy="256" r="8" fill="#5eead4" />
  <circle cx="452" cy="256" r="8" fill="#5eead4" />
</svg>